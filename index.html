        /* Blinking WhatsApp Button */
        .whatsapp-btn {

            background: #25D366;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
